name: Deploy TURN credentials Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # copied into the Worker's own secrets on every deploy
          secrets: |
            TURN_KEY_ID
            TURN_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_API_TOKEN: ${{ secrets.TURN_API_TOKEN }}
